workflows:
  neonkus-android:
    name: Neon Kuş - Android Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 20
      groups:
        - google_play
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Add Android platform
        script: npx cap add android || true
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Bump target SDK
        script: |
          sed -i '' 's/targetSdkVersion = [0-9]*/targetSdkVersion = 35/' android/variables.gradle
          sed -i '' 's/compileSdkVersion = [0-9]*/compileSdkVersion = 35/' android/variables.gradle
      - name: Bump version code
        script: |
          cd android
          sed -i '' "s/versionCode [0-9]*/versionCode $PROJECT_BUILD_NUMBER/" app/build.gradle
          cd ..
      - name: Set up keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > /tmp/neonkus.keystore
      - name: Configure release signing
        script: |
          cat >> android/app/build.gradle << 'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("/tmp/neonkus.keystore")
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
      - name: Build signed AAB
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: alpha
        submit_as_draft: true
